<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Snake Game</title>
		<link
			rel="icon"
			type="image/png"
			href="./public/favicon/favicon-96x96.png"
			sizes="96x96"
		/>
		<link rel="icon" type="image/svg+xml" href="./public/favicon/favicon.svg" />
		<link rel="shortcut icon" href="./public/favicon/favicon.ico" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="./public/favicon/apple-touch-icon.png"
		/>
		<meta name="apple-mobile-web-app-title" content="Snake Game" />
		<link rel="manifest" href="./public/favicon/site.webmanifest" />
		<link rel="stylesheet" href="./src/scss/style.scss" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

			href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"

	<body>
		<section class="main-menu">
			<h1 class="main-menu__title"><pre></pre></h1>
			<h2 class="main-menu__subtitle">- press any key -</h2>
			<fieldset class="main-menu__container hide">
				<legend class="main-menu__container-legend">Main menu</legend>
				<button data-start class="main-menu__btn main-menu__btn_active">
					play
				</button>
				<button data-settings class="main-menu__btn">settings</button>

				<p class="main-menu__clue">↑↓ move · enter select</p>
			</fieldset>

		<script type="module" src="./src/js/main.js"></script>
